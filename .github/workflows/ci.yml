name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rail_booking_test
          POSTGRES_USER: rail_app
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rail_app -d rail_booking_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://rail_app:test-only-password@localhost:5432/rail_booking_test?sslmode=disable
      TEST_DATABASE_URL: postgres://rail_app:test-only-password@localhost:5432/rail_booking_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Formatting
        run: test -z "$(gofmt -l apps/api)"
      - name: Static analysis
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race ./...
      - name: Apply migrations
        run: go run ./apps/api/cmd/migrate up
      - name: Validate latest migration rollback
        run: |
          go run ./apps/api/cmd/migrate down
          go run ./apps/api/cmd/migrate up
      - name: Seed database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed/seed.sql
      - name: Concurrency integration test
        run: go test -race -tags=integration ./apps/api/internal/booking -run Concurrent -count=3

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Validate OpenAPI contract
        run: pnpm lint:openapi --format=github-actions
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build service images
        run: docker compose build
