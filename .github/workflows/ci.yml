name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rail_booking_test
          POSTGRES_USER: rail_app
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rail_app -d rail_booking_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://rail_app:test-only-password@localhost:5432/rail_booking_test?sslmode=disable
      TEST_DATABASE_URL: postgres://rail_app:test-only-password@localhost:5432/rail_booking_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - name: Formatting
        run: test -z "$(gofmt -l apps/api)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Migrate and seed
        run: |
          go run ./apps/api/cmd/migrate up
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed/seed.sql
      - name: Concurrency integration test
        run: go test -race -tags=integration ./apps/api/internal/booking -run Concurrent -count=3

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build api migrate
