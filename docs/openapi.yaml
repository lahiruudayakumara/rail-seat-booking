openapi: 3.1.0
info:
  title: Segment Train Booking API
  version: 1.0.0
  summary: Segment-aware reserved-seat booking contract
  description: Initial documentation contract. Demo data is not official Sri Lanka Railways data.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - {name: Health}
  - {name: Routes}
  - {name: Stations}
  - {name: Train runs}
  - {name: Availability}
  - {name: Fares}
  - {name: Bookings}
  - {name: Payments}
  - {name: Passenger accounts}
  - {name: Administration}
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      responses:
        '200': {$ref: '#/components/responses/HealthResponse'}
  /ready:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        '200': {$ref: '#/components/responses/HealthResponse'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/routes:
    get:
      tags: [Routes]
      operationId: listRoutes
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Route page
          content: {application/json: {schema: {$ref: '#/components/schemas/RoutePage'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/routes/{routeId}:
    get:
      tags: [Routes]
      operationId: getRoute
      parameters: [{$ref: '#/components/parameters/RouteId'}]
      responses:
        '200': {description: Route, content: {application/json: {schema: {$ref: '#/components/schemas/Route'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/routes/{routeId}/stations:
    get:
      tags: [Routes, Stations]
      operationId: listRouteStations
      parameters: [{$ref: '#/components/parameters/RouteId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Ordered stations, content: {application/json: {schema: {$ref: '#/components/schemas/StationPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/stations:
    get:
      tags: [Stations]
      operationId: listStations
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Station page, content: {application/json: {schema: {$ref: '#/components/schemas/StationPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/train-runs:
    get:
      tags: [Train runs]
      operationId: listTrainRuns
      parameters:
        - {name: travelDate, in: query, required: true, schema: {type: string, format: date}}
        - {name: routeId, in: query, schema: {type: string, format: uuid}}
        - {name: originStationId, in: query, schema: {type: string, format: uuid}}
        - {name: destinationStationId, in: query, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Run page, content: {application/json: {schema: {$ref: '#/components/schemas/TrainRunPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/train-runs/{trainRunId}:
    get:
      tags: [Train runs]
      operationId: getTrainRun
      parameters: [{$ref: '#/components/parameters/TrainRunId'}]
      responses:
        '200': {description: Train run, content: {application/json: {schema: {$ref: '#/components/schemas/TrainRun'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/train-runs/{trainRunId}/available-seats:
    get:
      tags: [Availability]
      operationId: listAvailableSeats
      parameters:
        - {$ref: '#/components/parameters/TrainRunId'}
        - {$ref: '#/components/parameters/OriginStationId'}
        - {$ref: '#/components/parameters/DestinationStationId'}
        - {name: coachClass, in: query, schema: {type: string, maxLength: 32}}
      responses:
        '200': {description: Availability snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/AvailabilityResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/train-runs/{trainRunId}/seat-map:
    get:
      tags: [Availability]
      operationId: getSeatMap
      description: Returns every active reserved seat with availability derived for the requested half-open journey segment.
      parameters:
        - {$ref: '#/components/parameters/TrainRunId'}
        - {$ref: '#/components/parameters/OriginStationId'}
        - {$ref: '#/components/parameters/DestinationStationId'}
        - {name: coachClass, in: query, schema: {type: string, maxLength: 32}}
      responses:
        '200': {description: Segment seat map snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/SeatMapResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/fare-quotes:
    post:
      tags: [Fares]
      operationId: createFareQuote
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FareQuoteRequest'}}}}
      responses:
        '201': {description: Quote created, content: {application/json: {schema: {$ref: '#/components/schemas/FareQuote'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/bookings:
    post:
      tags: [Bookings]
      operationId: createBooking
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateBookingRequest'}}}}
      responses:
        '201': {description: Held booking prepared for payment, headers: {Location: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/booking-groups:
    post:
      tags: [Bookings]
      operationId: createBookingGroup
      description: Atomically converts two to six seat holds for the same train and segment into one payable group with a single reference.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateBookingGroupRequest'}}}}
      responses:
        '201': {description: Group prepared for one payment, headers: {Location: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/BookingGroup'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/passenger/register:
    post:
      tags: [Passenger accounts]
      operationId: registerPassenger
      description: Creates an optional passenger account and starts an HTTP-only cookie session. Guest checkout remains available.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PassengerRegistration'}}}}
      responses:
        '201': {description: Passenger account created, content: {application/json: {schema: {$ref: '#/components/schemas/PassengerAccount'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/passenger/login:
    post:
      tags: [Passenger accounts]
      operationId: loginPassenger
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PassengerLogin'}}}}
      responses:
        '200': {description: Signed-in passenger, content: {application/json: {schema: {$ref: '#/components/schemas/PassengerAccount'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/passenger/logout:
    post:
      tags: [Passenger accounts]
      operationId: logoutPassenger
      responses:
        '204': {description: Session revoked and cookie cleared}
  /api/v1/passenger/me:
    get:
      tags: [Passenger accounts]
      operationId: getCurrentPassenger
      security: [{passengerCookie: []}]
      responses:
        '200': {description: Current passenger, content: {application/json: {schema: {$ref: '#/components/schemas/PassengerAccount'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/passenger/travellers:
    get:
      tags: [Passenger accounts]
      operationId: listSavedTravellers
      security: [{passengerCookie: []}]
      responses:
        '200': {description: Account-owned saved travellers, content: {application/json: {schema: {$ref: '#/components/schemas/SavedTravellerPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Passenger accounts]
      operationId: createSavedTraveller
      security: [{passengerCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SavedTravellerInput'}}}}
      responses:
        '201': {description: Traveller saved, content: {application/json: {schema: {$ref: '#/components/schemas/SavedTraveller'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/passenger/travellers/{travellerId}:
    parameters:
      - {name: travellerId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Passenger accounts]
      operationId: updateSavedTraveller
      security: [{passengerCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SavedTravellerInput'}}}}
      responses:
        '200': {description: Traveller updated, content: {application/json: {schema: {$ref: '#/components/schemas/SavedTraveller'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Passenger accounts]
      operationId: deleteSavedTraveller
      security: [{passengerCookie: []}]
      responses:
        '204': {description: Traveller removed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/passenger/preferences:
    get:
      tags: [Passenger accounts]
      operationId: getPassengerPreferences
      security: [{passengerCookie: []}]
      responses:
        '200': {description: Booking preferences, content: {application/json: {schema: {$ref: '#/components/schemas/PassengerPreferences'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      tags: [Passenger accounts]
      operationId: updatePassengerPreferences
      security: [{passengerCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PassengerPreferencesInput'}}}}
      responses:
        '200': {description: Preferences saved, content: {application/json: {schema: {$ref: '#/components/schemas/PassengerPreferences'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/passenger/bookings:
    get:
      tags: [Passenger accounts, Bookings]
      operationId: listPassengerBookings
      security: [{passengerCookie: []}]
      responses:
        '200': {description: Account-owned bookings in newest-first order, content: {application/json: {schema: {$ref: '#/components/schemas/BookingPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/booking-holds:
    post:
      tags: [Bookings]
      operationId: createBookingHold
      description: Atomically holds the quoted seat and segment for a short period.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BookingHoldRequest'}}}}
      responses:
        '201': {description: Seat held, content: {application/json: {schema: {$ref: '#/components/schemas/BookingHold'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/booking-holds/{holdId}:
    delete:
      tags: [Bookings]
      operationId: releaseBookingHold
      description: Releases an unused seat hold immediately when a passenger removes a seat from the selection.
      security: [{bearerAuth: []}]
      parameters:
        - {name: holdId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Hold released or no longer releasable}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/bookings/access:
    post:
      tags: [Bookings]
      operationId: accessBooking
      description: Verifies the booking contact. Email matching is case-insensitive; Sri Lankan phone numbers accept local 077…, 94…, 0094…, or +94… notation.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BookingAccessRequest'}}}}
      responses:
        '200': {description: Verified booking with a short-lived management token, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/payments/sandbox:
    post:
      tags: [Bookings]
      operationId: checkoutSandboxPayment
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      description: Local-development payment adapter that atomically pays, confirms, issues a ticket, and queues notification delivery.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SandboxCheckoutRequest'}}}}
      responses:
        '201': {description: Paid booking and ticket, content: {application/json: {schema: {$ref: '#/components/schemas/CheckoutResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/payments/sandbox/groups:
    post:
      tags: [Payments]
      operationId: checkoutSandboxGroupPayment
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      description: Atomically collects one local-development payment, confirms every member booking, and issues one ticket per seat.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SandboxGroupCheckoutRequest'}}}}
      responses:
        '201': {description: Paid group and issued tickets, content: {application/json: {schema: {$ref: '#/components/schemas/GroupCheckoutResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/payments/payhere:
    post:
      tags: [Payments]
      operationId: startPayHereCheckout
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      description: Creates or reuses a pending PayHere checkout. The returned fields form a server-signed POST to the hosted checkout page; no merchant secret is returned.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PayHereCheckoutRequest'}}}}
      responses:
        '201': {description: Signed hosted-checkout form, content: {application/json: {schema: {$ref: '#/components/schemas/PayHereCheckoutResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/payments/payhere/groups:
    post:
      tags: [Payments]
      operationId: startPayHereGroupCheckout
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      description: Creates or reuses one signed PayHere checkout for the complete group fare.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PayHereGroupCheckoutRequest'}}}}
      responses:
        '201': {description: Signed hosted-checkout form, content: {application/json: {schema: {$ref: '#/components/schemas/PayHereCheckoutResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/payments/{paymentId}:
    get:
      tags: [Payments]
      operationId: getPayHerePayment
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/PaymentId'}]
      description: Returns the authoritative payment and booking state after the browser returns from hosted checkout.
      responses:
        '200': {description: Current payment state and ticket when paid, content: {application/json: {schema: {$ref: '#/components/schemas/PayHerePaymentStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/webhooks/payhere:
    post:
      tags: [Payments]
      operationId: receivePayHereNotification
      description: PayHere server callback. The API verifies the provider signature, amount, currency and replay fingerprint before changing durable state.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/PayHereNotification'}
      responses:
        '200': {description: Notification processed or safely deduplicated}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/tickets/verify:
    post:
      tags: [Bookings]
      operationId: verifyTicket
      description: Verifies a ticket credential without exposing passenger personal data.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VerifyTicketRequest'}}}}
      responses:
        '200': {description: Ticket verification result, content: {application/json: {schema: {$ref: '#/components/schemas/TicketVerification'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/bookings/{bookingId}/cancel:
    post:
      security: [{bearerAuth: []}, {passengerCookie: []}]
      tags: [Bookings]
      operationId: cancelBooking
      parameters: [{$ref: '#/components/parameters/BookingId'}, {$ref: '#/components/parameters/OptionalIdempotencyKey'}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/CancelBookingRequest'}}}}
      responses:
        '200': {description: Cancelled or already-cancelled booking, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/admin/train-runs/{trainRunId}/dashboard:
    get:
      tags: [Administration]
      operationId: getTrainRunDashboard
      security: [{adminAuth: []}]
      parameters: [{$ref: '#/components/parameters/TrainRunId'}]
      responses:
        '200': {description: Segment utilization and financial dashboard, content: {application/json: {schema: {$ref: '#/components/schemas/AdminDashboard'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: BookingManagementToken, description: Short-lived signed token issued after contact verification}
    adminAuth: {type: http, scheme: bearer, bearerFormat: AdminAPIKey, description: Server-managed department administrator credential}
    passengerCookie: {type: apiKey, in: cookie, name: rail_passenger_session, description: Opaque revocable passenger session stored in an HTTP-only SameSite cookie}
  parameters:
    RouteId: {name: routeId, in: path, required: true, schema: {type: string, format: uuid}}
    TrainRunId: {name: trainRunId, in: path, required: true, schema: {type: string, format: uuid}}
    BookingId: {name: bookingId, in: path, required: true, schema: {type: string, format: uuid}}
    PaymentId: {name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}
    OriginStationId: {name: originStationId, in: query, required: true, schema: {type: string, format: uuid}}
    DestinationStationId: {name: destinationStationId, in: query, required: true, schema: {type: string, format: uuid}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 512}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    OptionalIdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 16, maxLength: 128}}
  responses:
    HealthResponse: {description: Health state, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
    BadRequest: {description: Invalid input, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Authentication required or invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Current state conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unprocessable: {description: Domain rule violation, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    TooManyRequests: {description: Rate limit exceeded, headers: {Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ServiceUnavailable: {description: Dependency unavailable, headers: {Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Health:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [ok, not_ready]}, checks: {type: object, additionalProperties: {type: string}}}
    PageInfo:
      type: object
      required: [hasMore]
      properties: {nextCursor: {type: [string, 'null']}, hasMore: {type: boolean}}
    Station:
      type: object
      required: [id, code, name]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: KDY}
        name: {type: string, example: Kandy}
        position: {type: integer, minimum: 0, example: 4}
        cumulativeDistanceKm: {type: string, pattern: '^\d+(\.\d{1,3})?$', example: '120.000'}
    Route:
      type: object
      required: [id, code, name, direction, timezone]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: CF-BD-UP}
        name: {type: string, example: Colombo Fort–Badulla}
        direction: {type: string, example: UP_COUNTRY}
        timezone: {type: string, example: Asia/Colombo}
    TrainRun:
      type: object
      required: [id, routeId, trainId, serviceDate, departureAt, arrivalAt, status]
      properties:
        id: {type: string, format: uuid}
        routeId: {type: string, format: uuid}
        trainId: {type: string, format: uuid}
        serviceDate: {type: string, format: date}
        departureAt: {type: string, format: date-time}
        arrivalAt: {type: string, format: date-time}
        status: {type: string, enum: [SCHEDULED, BOARDING, DEPARTED, COMPLETED, CANCELLED]}
    Seat:
      type: object
      required: [id, label, coachId, coachCode, coachClass, attributes]
      properties:
        id: {type: string, format: uuid}
        label: {type: string, example: 12A}
        coachId: {type: string, format: uuid}
        coachCode: {type: string, example: R1}
        coachClass: {type: string, example: FIRST}
        attributes: {type: array, items: {type: string}, example: [WINDOW]}
    SeatMapItem:
      allOf:
        - {$ref: '#/components/schemas/Seat'}
        - type: object
          required: [availabilityStatus]
          properties:
            availabilityStatus: {type: string, enum: [AVAILABLE, BOOKED]}
    Money:
      type: object
      required: [amountMinor, currency, currencyScale]
      properties: {amountMinor: {type: integer, format: int64, minimum: 0, example: 46000}, currency: {type: string, pattern: '^[A-Z]{3}$', example: LKR}, currencyScale: {type: integer, minimum: 0, maximum: 4, example: 2}}
    FareQuoteRequest:
      type: object
      additionalProperties: false
      required: [trainRunId, seatId, originStationId, destinationStationId]
      properties:
        trainRunId: {type: string, format: uuid}
        seatId: {type: string, format: uuid}
        originStationId: {type: string, format: uuid}
        destinationStationId: {type: string, format: uuid}
    FareQuote:
      allOf:
        - {$ref: '#/components/schemas/Money'}
        - type: object
          required: [id, distanceKm, breakdown, expiresAt]
          properties:
            id: {type: string, format: uuid}
            distanceKm: {type: string, example: '120.000'}
            breakdown: {type: object, additionalProperties: {type: integer, format: int64}}
            expiresAt: {type: string, format: date-time}
    PassengerInput:
      type: object
      additionalProperties: false
      required: [fullName]
      properties: {fullName: {type: string, minLength: 1, maxLength: 120}, email: {type: string, format: email, maxLength: 254}, phone: {type: string, pattern: '^\+[1-9]\d{7,14}$'}}
      anyOf: [{required: [email]}, {required: [phone]}]
    PassengerRegistration:
      type: object
      additionalProperties: false
      required: [fullName, email, password]
      properties:
        fullName: {type: string, minLength: 2, maxLength: 120}
        email: {type: string, format: email, maxLength: 254}
        phone: {type: string, pattern: '^\+[1-9]\d{7,14}$'}
        password: {type: string, minLength: 10, maxLength: 72, format: password}
    PassengerLogin:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 72, format: password}
    PassengerAccount:
      type: object
      required: [id, fullName, email, createdAt]
      properties:
        id: {type: string, format: uuid}
        fullName: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
        createdAt: {type: string, format: date-time}
    SavedTravellerInput:
      type: object
      additionalProperties: false
      required: [fullName, email, phone]
      properties:
        fullName: {type: string, minLength: 2, maxLength: 120}
        email: {type: string, format: email, maxLength: 254, description: May be empty when phone is provided}
        phone: {type: string, pattern: '^\+[1-9]\d{7,14}$', description: May be empty when email is provided}
    SavedTraveller:
      allOf:
        - {$ref: '#/components/schemas/SavedTravellerInput'}
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: {type: string, format: uuid}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    SavedTravellerPage:
      type: object
      required: [items]
      properties:
        items: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/SavedTraveller'}}
    PassengerPreferencesInput:
      type: object
      additionalProperties: false
      required: [preferredCoachClass, preferredSeatType, language]
      properties:
        preferredCoachClass: {type: string, enum: [ANY, FIRST, SECOND]}
        preferredSeatType: {type: string, enum: [ANY, WINDOW, AISLE]}
        language: {type: string, enum: [en, si, ta]}
    PassengerPreferences:
      allOf:
        - {$ref: '#/components/schemas/PassengerPreferencesInput'}
        - type: object
          properties:
            updatedAt: {type: string, format: date-time}
    CreateBookingRequest:
      type: object
      additionalProperties: false
      required: [holdId, holdToken, fareQuoteId, trainRunId, seatId, originStationId, destinationStationId, passenger]
      properties:
        holdId: {type: string, format: uuid}
        holdToken: {type: string}
        fareQuoteId: {type: string, format: uuid}
        trainRunId: {type: string, format: uuid}
        seatId: {type: string, format: uuid}
        originStationId: {type: string, format: uuid}
        destinationStationId: {type: string, format: uuid}
        passenger: {$ref: '#/components/schemas/PassengerInput'}
    CreateBookingGroupRequest:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          minItems: 2
          maxItems: 6
          items: {$ref: '#/components/schemas/CreateBookingRequest'}
    BookingHoldRequest:
      type: object
      additionalProperties: false
      required: [fareQuoteId]
      properties:
        fareQuoteId: {type: string, format: uuid}
    BookingHold:
      type: object
      required: [id, status, expiresAt, managementToken]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, const: HELD}
        expiresAt: {type: string, format: date-time}
        managementToken: {type: string}
    BookingAccessRequest:
      type: object
      additionalProperties: false
      required: [reference, contact]
      properties:
        reference: {type: string, pattern: '^BK-[A-Z0-9]{8,16}$'}
        contact: {type: string, minLength: 8, maxLength: 254, description: Email address or E.164 phone used for the booking}
    SandboxCheckoutRequest:
      type: object
      additionalProperties: false
      required: [bookingId, bookingToken]
      properties:
        bookingId: {type: string, format: uuid}
        bookingToken: {type: string}
    SandboxGroupCheckoutRequest:
      type: object
      additionalProperties: false
      required: [groupId, groupToken]
      properties:
        groupId: {type: string, format: uuid}
        groupToken: {type: string}
    PayHereCheckoutRequest:
      type: object
      additionalProperties: false
      required: [bookingId, bookingToken, billingAddress, city]
      properties:
        bookingId: {type: string, format: uuid}
        bookingToken: {type: string}
        billingAddress: {type: string, minLength: 3, maxLength: 200}
        city: {type: string, minLength: 2, maxLength: 80}
    PayHereGroupCheckoutRequest:
      type: object
      additionalProperties: false
      required: [groupId, groupToken, billingAddress, city]
      properties:
        groupId: {type: string, format: uuid}
        groupToken: {type: string}
        billingAddress: {type: string, minLength: 3, maxLength: 200}
        city: {type: string, minLength: 2, maxLength: 80}
    PayHereCheckoutResponse:
      type: object
      required: [paymentId, bookingId, status, expiresAt, actionUrl, fields]
      properties:
        paymentId: {type: string, format: uuid}
        bookingId: {type: string, format: uuid}
        groupId: {type: string, format: uuid, description: Present for a group checkout}
        status: {type: string, const: PENDING}
        expiresAt: {type: string, format: date-time}
        actionUrl: {type: string, format: uri, description: PayHere hosted Sandbox or production checkout endpoint selected by server configuration}
        fields: {type: object, additionalProperties: {type: string}, description: Signed hidden form fields to POST to actionUrl}
    PayHerePaymentStatus:
      type: object
      required: [paymentId, bookingId, status, providerReference, amountMinor, currency]
      properties:
        paymentId: {type: string, format: uuid}
        bookingId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, PAID, FAILED, DISPUTED]}
        providerReference: {type: string}
        amountMinor: {type: integer, format: int64, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        paidAt: {type: string, format: date-time}
        booking: {$ref: '#/components/schemas/Booking'}
        ticket: {type: object, required: [id, verificationCode, status], properties: {id: {type: string, format: uuid}, verificationCode: {type: string}, status: {type: string, enum: [ACTIVE, CANCELLED, USED]}}}
        group: {$ref: '#/components/schemas/BookingGroup'}
        tickets: {type: array, items: {$ref: '#/components/schemas/Ticket'}}
    PayHereNotification:
      type: object
      additionalProperties: true
      required: [merchant_id, order_id, payment_id, payhere_amount, payhere_currency, status_code, md5sig]
      properties:
        merchant_id: {type: string}
        order_id: {type: string, format: uuid}
        payment_id: {type: string}
        payhere_amount: {type: string, pattern: '^\\d+\\.\\d{2}$'}
        payhere_currency: {type: string, pattern: '^[A-Z]{3}$'}
        status_code: {type: string, enum: ['2', '0', '-1', '-2', '-3']}
        md5sig: {type: string, pattern: '^[A-F0-9]{32}$'}
    CheckoutResult:
      type: object
      required: [payment, ticket, booking]
      properties:
        payment: {type: object, additionalProperties: true}
        ticket: {type: object, required: [id, verificationCode, status], properties: {id: {type: string, format: uuid}, verificationCode: {type: string}, status: {type: string, enum: [ACTIVE, CANCELLED, USED]}}}
        booking: {$ref: '#/components/schemas/Booking'}
    Ticket:
      type: object
      required: [id, verificationCode, status]
      properties:
        id: {type: string, format: uuid}
        verificationCode: {type: string}
        status: {type: string, enum: [ACTIVE, CANCELLED, USED]}
    GroupCheckoutResult:
      type: object
      required: [payment, tickets, group]
      properties:
        payment: {type: object, additionalProperties: true}
        tickets: {type: array, minItems: 2, maxItems: 6, items: {$ref: '#/components/schemas/Ticket'}}
        group: {$ref: '#/components/schemas/BookingGroup'}
    VerifyTicketRequest:
      type: object
      additionalProperties: false
      required: [verificationCode]
      properties: {verificationCode: {type: string, minLength: 32, maxLength: 128}}
    TicketVerification:
      type: object
      required: [valid, ticketId, ticketStatus, bookingReference, bookingStatus, trainRunId, coachCode, seatLabel, originStationId, destinationStationId, verifiedAt]
      properties:
        valid: {type: boolean}
        ticketId: {type: string, format: uuid}
        ticketStatus: {type: string, enum: [ACTIVE, CANCELLED, USED]}
        bookingReference: {type: string}
        bookingStatus: {type: string}
        trainRunId: {type: string, format: uuid}
        coachCode: {type: string}
        seatLabel: {type: string}
        originStationId: {type: string, format: uuid}
        destinationStationId: {type: string, format: uuid}
        verifiedAt: {type: string, format: date-time}
    Booking:
      type: object
      required: [id, reference, status, trainRunId, seat, originStationId, destinationStationId, fare, createdAt]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string, example: BK-7J4M9Q2X}
        status: {type: string, enum: [PENDING, HELD, CONFIRMED, CANCELLED, EXPIRED, COMPLETED]}
        trainRunId: {type: string, format: uuid}
        seat: {$ref: '#/components/schemas/Seat'}
        originStationId: {type: string, format: uuid}
        destinationStationId: {type: string, format: uuid}
        fare: {$ref: '#/components/schemas/Money'}
        createdAt: {type: string, format: date-time}
        confirmedAt: {type: [string, 'null'], format: date-time}
        cancelledAt: {type: [string, 'null'], format: date-time}
        managementToken: {type: string, description: Short-lived opaque token for managing this booking}
        refund: {$ref: '#/components/schemas/RefundSummary'}
    BookingGroupMember:
      type: object
      required: [booking, passenger]
      properties:
        booking: {$ref: '#/components/schemas/Booking'}
        passenger: {$ref: '#/components/schemas/PassengerInput'}
    BookingGroup:
      type: object
      required: [id, reference, status, members, fare, createdAt]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string, pattern: '^GR-[A-Z0-9]{8,16}$'}
        status: {type: string, enum: [HELD, CONFIRMED, CANCELLED, EXPIRED, COMPLETED]}
        members: {type: array, minItems: 2, maxItems: 6, items: {$ref: '#/components/schemas/BookingGroupMember'}}
        fare: {$ref: '#/components/schemas/Money'}
        createdAt: {type: string, format: date-time}
        confirmedAt: {type: [string, 'null'], format: date-time}
        managementToken: {type: string, description: Short-lived opaque token for paying or managing this group}
    BookingPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Booking'}}
    RefundSummary:
      type: object
      required: [id, status, amountMinor, currency]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, SUCCEEDED, FAILED]}
        amountMinor: {type: integer, format: int64}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    AdminDashboard:
      type: object
      required: [trainRunId, sellableSeatSegments, occupiedSeatSegments, segmentUtilizationPercent, confirmedBookings, cancelledBookings, heldBookings, grossRevenueMinor, refundedMinor, netRevenueMinor, currency, pendingDeliveries]
      properties:
        trainRunId: {type: string, format: uuid}
        sellableSeatSegments: {type: integer, format: int64}
        occupiedSeatSegments: {type: integer, format: int64}
        segmentUtilizationPercent: {type: number, format: double}
        confirmedBookings: {type: integer, format: int64}
        cancelledBookings: {type: integer, format: int64}
        heldBookings: {type: integer, format: int64}
        grossRevenueMinor: {type: integer, format: int64}
        refundedMinor: {type: integer, format: int64}
        netRevenueMinor: {type: integer, format: int64}
        currency: {type: string}
        pendingDeliveries: {type: integer, format: int64}
    CancelBookingRequest:
      type: object
      additionalProperties: false
      properties: {reason: {type: string, maxLength: 500}}
    AvailabilityResponse:
      type: object
      required: [trainRunId, originStationId, destinationStationId, items]
      properties:
        trainRunId: {type: string, format: uuid}
        originStationId: {type: string, format: uuid}
        destinationStationId: {type: string, format: uuid}
        items: {type: array, items: {$ref: '#/components/schemas/Seat'}}
    SeatMapResponse:
      type: object
      required: [trainRunId, originStationId, destinationStationId, items]
      properties:
        trainRunId: {type: string, format: uuid}
        originStationId: {type: string, format: uuid}
        destinationStationId: {type: string, format: uuid}
        items: {type: array, items: {$ref: '#/components/schemas/SeatMapItem'}}
    RoutePage: {type: object, required: [items, page], properties: {items: {type: array, items: {$ref: '#/components/schemas/Route'}}, page: {$ref: '#/components/schemas/PageInfo'}}}
    StationPage: {type: object, required: [items, page], properties: {items: {type: array, items: {$ref: '#/components/schemas/Station'}}, page: {$ref: '#/components/schemas/PageInfo'}}}
    TrainRunPage: {type: object, required: [items, page], properties: {items: {type: array, items: {$ref: '#/components/schemas/TrainRun'}}, page: {$ref: '#/components/schemas/PageInfo'}}}
    FieldError:
      type: object
      required: [field, message]
      properties: {field: {type: string}, message: {type: string}}
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string, example: VALIDATION_ERROR}
        message: {type: string, example: The request contains invalid fields.}
        details: {oneOf: [{type: array, items: {$ref: '#/components/schemas/FieldError'}}, {type: object, additionalProperties: true}]}
        requestId: {type: string, format: uuid}
